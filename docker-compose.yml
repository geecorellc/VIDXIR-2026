services:
  postgres:
    image: postgres:16-alpine
    container_name: vidxir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vidxir
      POSTGRES_PASSWORD: vidxir
      POSTGRES_DB: vidxir
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidxir -d vidxir"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vidxir-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: vidxir-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vidxirminio
      MINIO_ROOT_PASSWORD: vidxirminio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the media bucket on first boot so the app has somewhere to write.
  minio-init:
    image: minio/mc:latest
    container_name: vidxir-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 vidxirminio vidxirminio &&
      mc mb --ignore-existing local/vidxir-media &&
      mc mb --ignore-existing local/vidxir-test &&
      echo 'buckets ready'
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
